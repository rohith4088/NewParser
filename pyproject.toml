[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onprem-analyzer"
version = "0.1.0"
description = "Offline-first support bundle parser and analyzer"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "orjson>=3.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
analyzer = "analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
