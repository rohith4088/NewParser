- id: core-infrastructure-platform
  name: Core Infrastructure & Platform
  description: Fundamental Kubernetes networking, security, and storage controllers.
  namespaces:
    kube-system:
      description: Core Kubernetes components. Calico handles networking (CNI), CoreDNS resolves internal
        service names, and metrics-server provides CPU/Memory metrics for autoscaling.
      containers:
      - calico-node
      - calico-kube-controllers
      - coredns
      - metrics-server
    base:
      description: Platform security tools. Cert-manager provisions internal certificates. OpenBao/Vault
        manages secrets securely.
      containers:
      - cert-manager-cainjector
      - cert-manager-webhook
      - openbao
      - vault-onprem-sidecar
      - sidecar-injector
    istio-system:
      description: Service mesh (Istio) that handles mTLS encryption, load balancing, and traffic routing
        between microservices.
      containers:
      - discovery
      - istio-proxy
    metallb-system:
      description: A network load-balancer implementation for bare-metal/on-premise Kubernetes clusters,
        giving external IPs to services.
      containers:
      - controller
      - speaker
    mayastor:
      description: Software-defined storage layer. Mayastor provides highly available block storage for
        databases, and OpenEBS provides NFS file sharing.
      containers:
      - api-rest
      - operator-diskpool
      - mayastor-localpv-provisioner
      - openebs-nfs-nfs-provisioner
    openebs-nfs:
      description: Software-defined storage layer. Mayastor provides highly available block storage for
        databases, and OpenEBS provides NFS file sharing.
      containers:
      - api-rest
      - operator-diskpool
      - mayastor-localpv-provisioner
      - openebs-nfs-nfs-provisioner
    cloudops:
